<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="logowrapper">
                <img src="../odin-lined.png" alt="">
                <p>ODIN</p>
            </div>
            <div class="credits"><p>Photo by <a href="xxx">bob</a> on <a href="">Unsplash</a></p></div>
        </div>
        <div class="right">
            <div class="rightcontainer">
                <p> This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want to.</p>
                <div class="formcontainer">
                    <form action="https://www.amazon.com.au/s" method="get" id="registerform">
                        <p>Let's Do this!</p>
                        <div class="inputcontainer">
                            <div class="inputcolumn">
                                <label for="firstname">FIRST NAME</label>
                                <input type="text" id="firstname" name="k" value="">
    
                                <label for="email">EMAIL</label>
                                <input type="text" id="email">
                            
                                <label for="password">PASSWORD</label>
                                <input type="password" id="password" required>
                            </div>
                            <div class="inputcolumn">
                                <label for="lastname">LAST NAME</label>
                                <input type="text" id="lastname">
    
                                <label for="phone">PHONE NUMBER</label>
                                <input type="text" id="phone" pattern="^\d[0-9]{10}$">
                                
                                <label for="confirmpassword">CONFIRM PASSWORD</label>
                                <input type="password" id="confirmpassword" required>
                            </div>
                        </div>
                        <div class="buttonarea">
                            <input type="submit" value="Register Now" id="submit">
                        </div>
                    </form>
                    <p>
                        <span>Already have an account? <a href="xxx.login" id="loginlink">Log in</a></span>
                    </p>                    
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
